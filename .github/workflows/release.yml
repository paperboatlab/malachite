name: release

# A tag v<version> publishes malachite-<version>.tar.gz (one top folder: bin/, server/, dist/, ...), the asset
# `paperboat app install malachite` unpacks. The server imports only node: builtins, so no node_modules.
# A tag with a pre-release part (v0.1.0-beta.1) is a prerelease: only the beta channel sees it.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Pack
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "${v%%-*}" = "$(node -p 'require("./package.json").version')" ] || { echo "tag $GITHUB_REF_NAME isn't package.json's version"; exit 1; }
          top=malachite-$v
          mkdir $top
          cp -r bin server dist package.json LICENSE README.md commands.toml $top/
          cp node_modules/@paperboatlab/ui/src/marks/malachite/icon.png $top/icon.png  # the desktop entry's icon (paperboat app install)
          tar -czf $top.tar.gz $top
          echo "TARBALL=$top.tar.gz" >> $GITHUB_ENV
          case $v in *-*) echo "PRE=--prerelease" >> $GITHUB_ENV ;; esac
      - run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --generate-notes $PRE
        env:
          GH_TOKEN: ${{ github.token }}
